<header class="bg-white fixed top-0 left-0 w-full z-50 shadow-sm border-b border-gray-100">
  <!-- h-[80px] để fix cứng chiều cao header, giúp vạch đỏ desktop canh đúng đỉnh -->
  <div class="max-w-7xl mx-auto px-4 md:px-8 flex items-center justify-between h-[80px]">
    
    <!-- Logo -->
    <a href="#hero" class="flex-shrink-0">
      <!-- Thay đường dẫn logo bằng file thực tế của bạn -->
      <img src="./src/assets/images/common/logo-sun.png" alt="Sun*" class="h-8 w-auto">
    </a>

    <!-- Nav Desktop (Chỉ hiện trên PC) -->
    <!-- h-full để thẻ a chiếm trọn chiều cao, gạch đỏ bám lên top -->
    <nav class="hidden lg:flex items-center gap-8 h-full">
      <!-- Active Link Desktop -->
      <a href="#hero" class="relative h-full flex items-center text-[#D32027] font-medium">
        <span class="absolute top-0 left-1/2 -translate-x-1/2 w-8 h-[5px] bg-[#D32027] rounded-b-sm"></span>
        <span data-i18n="nav.home">Trang chủ</span>
      </a>
      
      <!-- Inactive Links -->
      <a href="#about" class="h-full flex items-center text-gray-700 hover:text-[#D32027] transition-colors"><span data-i18n="nav.about">Về chúng tôi</span></a>
      <a href="#project" class="h-full flex items-center text-gray-700 hover:text-[#D32027] transition-colors"><span data-i18n="nav.project">Dự án</span></a>
      <a href="#career" class="h-full flex items-center text-gray-700 hover:text-[#D32027] transition-colors"><span data-i18n="nav.career">Cơ hội nghề nghiệp</span></a>
      <a href="#environment" class="h-full flex items-center text-gray-700 hover:text-[#D32027] transition-colors"><span data-i18n="nav.env">Môi trường làm việc</span></a>
      <a href="#news" class="h-full flex items-center text-gray-700 hover:text-[#D32027] transition-colors"><span data-i18n="nav.news">Tin tức</span></a>
    </nav>

    <!-- Khu vực Phải: Ngôn ngữ + Menu Mobile Toggle -->
    <div class="flex items-center gap-3 md:gap-5">
      
      <!-- Cụm đổi Ngôn ngữ (Sửa cho cả PC và Mobile y hệt nhau) -->
      <div class="flex items-center gap-1 border-l border-gray-300 pl-4 ml-2">
        <button data-lang="vi" class="text-[#D32027] border border-[#D32027] rounded px-2 py-1 font-semibold transition-colors">VI</button>
        <button data-lang="en" class="text-gray-400 border border-transparent px-2 py-1 hover:text-gray-600 font-semibold transition-colors">EN</button>
      </div>

      <!-- Nút Hamburger / Đóng Menu (Chỉ hiện Mobile) -->
      <button id="menu-toggle" class="lg:hidden flex justify-center items-center w-10 h-10 bg-gray-100 rounded-md hover:bg-gray-200 transition-colors">
        <svg id="menu-icon" class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <!-- Mặc định là hình 3 gạch -->
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Menu Mobile Dropdown (Mặc định ẩn) -->
  <div id="mobile-menu" class="hidden lg:hidden bg-white w-full absolute left-0 top-[80px] shadow-lg border-t border-gray-100">
    <nav class="flex flex-col text-[15px]">
      <!-- Active Link Mobile (Nền đỏ chữ trắng theo thiết kế) -->
      <a href="#hero" class="px-6 py-4 bg-[#B31F24] text-white font-medium"><span data-i18n="nav.home">Trang chủ</span></a>
      
      <!-- Inactive Links -->
      <a href="#about" class="px-6 py-4 text-gray-700 border-b border-gray-100 hover:bg-gray-50"><span data-i18n="nav.about">Về chúng tôi</span></a>
      <a href="#project" class="px-6 py-4 text-gray-700 border-b border-gray-100 hover:bg-gray-50"><span data-i18n="nav.project">Dự án</span></a>
      <a href="#career" class="px-6 py-4 text-gray-700 border-b border-gray-100 hover:bg-gray-50"><span data-i18n="nav.career">Cơ hội nghề nghiệp</span></a>
      <a href="#environment" class="px-6 py-4 text-gray-700 border-b border-gray-100 hover:bg-gray-50"><span data-i18n="nav.env">Môi trường làm việc</span></a>
      <a href="#news" class="px-6 py-4 text-gray-700 hover:bg-gray-50"><span data-i18n="nav.news">Tin tức</span></a>
    </nav>
  </div>
</header>
