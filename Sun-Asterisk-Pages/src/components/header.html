<header class="bg-white fixed top-0 left-0 w-full z-50 border-b border-gray-100 shadow-sm">

    <!-- Logo -->
    <a href="#hero" class="text-3xl font-extrabold text-primary flex-shrink-0">
      <img src="./src/assets/images/common/logo-sun.png" alt="Sun*" class="h-6 w-auto">
    </a>

    <!-- Nav desktop -->
    <nav class="hidden lg:flex items-center gap-8">
      <a href="#hero" class="nav-link nav-link-active text-red-600 font-medium">Trang chủ</a>
      <a href="#about" class="nav-link hover:text-red-600 transition-colors">Về chúng tôi</a>

  <!-- Menu mobile (Thêm hidden để mặc định ẩn) -->
  <div id="mobile-menu" class="hidden lg:hidden bg-white border-t border-gray-100 w-full absolute left-0 top-20 shadow-md">
